services:
  db-init:
    container_name: hmi-db-init
    image: postgres:17.9-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hmi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hmi1234}
      POSTGRES_DB: ${POSTGRES_DB:-hmi}
    command:
      - sh
      - -ec
      - |
        : "$${POSTGRES_USER:?POSTGRES_USER is required}"
        : "$${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
        : "$${POSTGRES_DB:?POSTGRES_DB is required}"
        export PGPASSWORD="$${POSTGRES_PASSWORD}"
        psql \
          --set=ON_ERROR_STOP=1 \
          --single-transaction \
          --host=db \
          --port=5432 \
          --username="$${POSTGRES_USER}" \
          --dbname="$${POSTGRES_DB}" \
          --file=/migrations/init-db.sql
    volumes:
      - ./scripts/init-db.sql:/migrations/init-db.sql:ro
    depends_on:
      db:
        condition: service_healthy

  api:
    container_name: hmi-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-hmi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hmi1234}
      POSTGRES_DB: ${POSTGRES_DB:-hmi}
    build:
      context: .
      dockerfile: Dockerfile
      target: ${SERVER_ENV:-dev}
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    expose:
      - "5050"
    ports:
      - "127.0.0.1:${API_PORT:-5050}:5050"
    volumes:
      - .:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5050/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s

  db:
    image: postgres:17.9-alpine
    container_name: hmi-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hmi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hmi1234}
      POSTGRES_DB: ${POSTGRES_DB:-hmi}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s

volumes:
  pgdata: