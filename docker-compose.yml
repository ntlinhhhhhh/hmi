services:
  db-init:
    container_name: hmi-db-init
    image: postgres:17.9-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hmi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hmi1234}
      POSTGRES_DB: ${POSTGRES_DB:-hmi}
    command:
      - sh
      - -ec
      - |
        : "$${POSTGRES_USER:?POSTGRES_USER is required}"
        : "$${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
        : "$${POSTGRES_DB:?POSTGRES_DB is required}"
        export PGPASSWORD="$${POSTGRES_PASSWORD}"
        psql \
          --set=ON_ERROR_STOP=1 \
          --single-transaction \
          --host=db \
          --port=5432 \
          --username="$${POSTGRES_USER}" \
          --dbname="$${POSTGRES_DB}" \
          --file=/migrations/init-db.sql
    volumes:
      - ./scripts/init-db.sql:/migrations/init-db.sql:ro
    depends_on:
      db:
        condition: service_healthy

  api:
    container_name: hmi-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-hmi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hmi1234}
      POSTGRES_DB: ${POSTGRES_DB:-hmi}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-hmi-media}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://s3:9000}
      S3_PRESIGN_ENDPOINT: ${S3_PRESIGN_ENDPOINT:-http://127.0.0.1:9000}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_CREATE_BUCKET_IF_MISSING: ${S3_CREATE_BUCKET_IF_MISSING:-true}
    build:
      context: .
      dockerfile: Dockerfile
      target: ${API_MODE:-dev}
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      s3:
        condition: service_healthy
    expose:
      - "5050"
    ports:
      - "127.0.0.1:${API_PORT:-5050}:5050"
    volumes:
      - .:/app
      - /app/node_modules
    healthcheck:
      test:
        ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5050/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s

  db:
    image: postgres:17.9-alpine
    container_name: hmi-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hmi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hmi1234}
      POSTGRES_DB: ${POSTGRES_DB:-hmi}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s

  s3:
    image: minio/minio:latest
    container_name: hmi-storage
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    command: server /data --address ":9000" --console-address ":9001"
    ports:
      - "127.0.0.1:${S3_API_PORT:-9000}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s

volumes:
  pgdata:
  s3data:
