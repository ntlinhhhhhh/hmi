services:
  db-init:
    container_name: hmi-db-init
    build:
      context: .
      dockerfile: Dockerfile
      target: ${SERVER_ENV:-dev}
    env_file:
      - .env
    command: bunx drizzle-kit push --force
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy

  api:
    container_name: hmi-api
    restart: unless-stopped
    env_file:
      - .env
    build:
      context: .
      dockerfile: Dockerfile
      target: ${SERVER_ENV:-dev}
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    expose:
      - "5050"
    volumes:
      - .:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5050/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s

  db:
    image: postgres:16.13-alpine
    container_name: hmi-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:${POSTGRES_PORT:-5432}"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s

volumes:
  pgdata:
  s3data:
  redisdata: